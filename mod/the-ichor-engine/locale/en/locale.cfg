[mod-name]
the-ichor-engine=The Ichor Engine

[mod-description]
the-ichor-engine=A Space Age planet overhaul about biological industry, neural control, mutation, sterile betrayal, and escape from a living factory.

[mod-setting-name]
ichor-debug-mode=Ichor debug mode
ichor-difficulty=Ichor difficulty
ichor-substrate-spread-multiplier=Substrate spread multiplier
ichor-lock-cargo-before-escape=Lock cargo before escape

[mod-setting-description]
ichor-debug-mode=Enable extra Ichor debug output.
ichor-difficulty=Campaign hostility profile for the living hive.
ichor-substrate-spread-multiplier=Multiplier for living substrate spread rate.
ichor-lock-cargo-before-escape=Block orbital cargo deliveries to Ichor until escape is complete.

[ichor-alert]
cargo-locked=Cargo Landing Pad blocked. Ichor remains under orbital quarantine until escape is complete.
cargo-pod-blocked=Cargo pod delivery blocked on Ichor.
cargo-unlocked=Orbital reintegration complete. Cargo deliveries to Ichor are now authorized.

[ichor-command]
status=Print Ichor runtime status.
complete-escape=Debug: mark escape complete and unlock cargo on Ichor.
reset-escape=Debug: reset escape state and lock cargo on Ichor.
