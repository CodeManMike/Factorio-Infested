[mod-name]
the-ichor-engine=The Ichor Engine

[mod-description]
the-ichor-engine=A Space Age planet overhaul about biological industry, neural control, mutation, sterile betrayal, and escape from a living factory.

[mod-setting-name]
ichor-debug-mode=Ichor debug mode
ichor-difficulty=Ichor difficulty
ichor-substrate-spread-multiplier=Substrate spread multiplier
ichor-lock-cargo-before-escape=Lock cargo before escape

[mod-setting-description]
ichor-debug-mode=Enable extra Ichor debug output.
ichor-difficulty=Campaign hostility profile for the living hive.
ichor-substrate-spread-multiplier=Multiplier for living substrate spread rate.
ichor-lock-cargo-before-escape=Block orbital cargo deliveries to Ichor until escape is complete.

[ichor-alert]
cargo-locked=Cargo Landing Pad blocked. Ichor remains under orbital quarantine until escape is complete.
cargo-pod-blocked=Cargo pod delivery blocked on Ichor.
cargo-unlocked=Orbital reintegration complete. Cargo deliveries to Ichor are now authorized.
no-substrate=Growth Chamber has no Living Substrate support.
no-neural-signal=Biological machine has no neural signal.
low-loyalty=Biological machine loyalty is falling.
mutation-warning=Mutation pressure is rising on a biological machine.
feralized=A biological machine has feralized.

[ichor-command]
status=Print Ichor runtime status.
complete-escape=Debug: mark escape complete and unlock cargo on Ichor.
reset-escape=Debug: reset escape state and lock cargo on Ichor.
feed=Debug: set Hive hunger to fed.
starve=Debug: set Hive hunger to starved.
spread-substrate=Debug: spread living substrate around the player.
dump-selected=Debug: print selected entity runtime state.
feralize-selected=Debug: force feralize the selected entity.
balance-report=Print aggregate Ichor balance report.

[ichor-gui]
top-button-tooltip=Open Ichor Hive Panel
hive-panel-title=Ichor Hive
hive-hunger=Hive Hunger: __1__%
hive-mood=Hive Mood: __1__
hive-cargo=Orbital Cargo: __1__
hive-entities=Tracked Entities: __1__
entity-panel-title=Selected Ichor Entity
entity-none=No entity selected.
entity-untracked=Untracked entity: __1__
entity-name=Entity: __1__
entity-state=State: __1__
entity-substrate=Living Substrate: __1__
entity-neural=Neural Signal: __1__%
entity-loyalty=Loyalty: __1__%
entity-mutation=Mutation Pressure: __1__%
entity-cause=Primary Cause: __1__
